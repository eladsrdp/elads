          tl.fromTo(ph.glow, { opacity: 1 }, { opacity: 0, duration: 0.6, immediateRender: false }, T(6, at));
          return b;
        });
        tl.fromTo(ph.p, { x: 500, opacity: 0 }, { x: 0, opacity: 1, duration: 0.8, ease: "power3.out" }, T(6, 1.5));
        // a pulse line from the map to the phone at each update
        [[0, 2.2], [4, 7.5], [4, 10.2]].forEach(([ri, at]) => {
          const [x, y] = route[ri];
          const zap = el(st, "abs", { left: px(MX + x - 20), top: px(MY + y - 20), width: "40px", height: "40px", borderRadius: "50%", background: TEAL, boxShadow: "0 0 26px 8px rgba(20,184,166,0.6)" });
          tl.fromTo(zap, { x: 0, y: 0, opacity: 0 }, { x: 1300 - (MX + x), y: 300 - (MY + y), opacity: 1, duration: 0.45, ease: "power2.in", immediateRender: false }, T(6, at - 0.4));
          tl.to(zap, { opacity: 0, duration: 0.1 }, T(6, at + 0.05));
          tl.set(zap, { opacity: 0 }, T(6, 0));
        });
        // daily scan: radar sweep — every parcel gets a check
        const ts = T(6, 12.6);
        tl.to(ph.p, { x: 600, opacity: 0, duration: 0.6, ease: "power2.in" }, ts);
        tl.to(mapL, { x: 420, scale: 1.08, duration: 0.9, ease: "power3.inOut" }, ts + 0.1);
        tl.to([truck, whP, stP], { opacity: 0.25, duration: 0.4 }, ts);
        const center = P([34.95, 31.4]);
        const RAD = 560;
        const radar = el(mapL, "abs", { left: px(MX + center[0] - RAD), top: px(MY + center[1] - RAD), width: px(2 * RAD), height: px(2 * RAD), borderRadius: "50%", background: `conic-gradient(from 0deg, rgba(20,184,166,0) 0deg, rgba(20,184,166,0) 300deg, rgba(20,184,166,0.45) 358deg, rgba(20,184,166,0) 360deg)` });
        tl.fromTo(radar, { opacity: 0, rotation: 0 }, { opacity: 1, duration: 0.3 }, ts + 0.8);
        tl.to(radar, { rotation: 360, duration: 2.6, ease: "none" }, ts + 0.8);
        tl.to(radar, { opacity: 0, duration: 0.4 }, ts + 3.4);
        const parcels = [[35.0, 32.8], [35.07, 32.92], [35.29, 32.7], [35.5, 32.95], [35.3, 33.0], [34.92, 32.47], [34.86, 32.33], [34.85, 32.17], [34.78, 32.08], [34.82, 32.0], [34.75, 31.95], [34.65, 31.8], [34.57, 31.67], [34.88, 31.9], [35.0, 31.85], [35.21, 31.77], [35.1, 31.55], [34.95, 31.42], [34.79, 31.25], [35.06, 31.1], [34.85, 30.95], [35.1, 30.6], [34.98, 29.6], [35.38, 32.2], [35.2, 32.3], [35.45, 31.85], [34.72, 31.45], [35.3, 31.3]];
        parcels.forEach((ll, k) => {
          const [x, y] = P(ll);
          const dot = el(mapL, "abs", { left: px(MX + x - 17), top: px(MY + y - 17), width: "34px", height: "34px", borderRadius: "9px", background: "#C9973A", display: "flex", alignItems: "center", justifyContent: "center", boxShadow: "0 4px 10px rgba(19,35,63,0.2)" });
          const chk = el(dot, "abs", { inset: "0", borderRadius: "9px", background: "#2FBF71", display: "flex", alignItems: "center", justifyContent: "center" }, icon("check", 26, "#fff"));
          tl.fromTo(dot, { scale: 0 }, { scale: 1, duration: 0.25, ease: "back.out(2)" }, ts + 0.3 + (k % 7) * 0.05);
          // angle (clockwise from top, matching conic-gradient) decides when the sweep passes
          const ang = (Math.atan2(x - center[0], -(y - center[1])) * 180 / Math.PI + 360) % 360;
          const at = ts + 0.8 + (ang / 360) * 2.6;
          tl.fromTo(chk, { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.25, ease: "back.out(3)" }, at);
        });
      })();

      // =========================================================
      // SCENE 7 — After pickup: bringing buyers back (65–74)
      // =========================================================
      (() => {
        const st = sceneFrame(tl, 7);
        const room = el(st, "layer", null, null, "s7-room");
        el(room, "abs", { left: "0", right: "0", top: "0", height: "760px", background: "linear-gradient(#F4E9D8, #EFE1CB)" });
        el(room, "abs", { left: "0", right: "0", top: "760px", bottom: "0", background: "#DCC9AA" });
        const beam = el(room, "abs", { left: "300px", top: "-100px", width: "380px", height: "900px", background: "linear-gradient(rgba(255,255,255,0.75), rgba(255,255,255,0))", transform: "skewX(-18deg)" }, null, "s7-beam");
        const sunI = el(room, "abs", { left: "120px", top: "90px", width: "100px", height: "100px" }, icon("sun", 100, "#F6B93B"));
        const days = el(room, "abs", { left: "240px", top: "125px", display: "flex", gap: "14px" },
          Array.from({ length: 7 }, () => `<span class="s7-day" style="display:block;width:26px;height:26px;border-radius:50%;border:4px solid rgba(19,35,63,0.3)"></span>`).join(""));
        // parcel opens, product pops out
        const box = el(room, "abs", { left: "520px", top: "420px", width: "420px", height: "360px" },
          `<svg width="420" height="360" viewBox="0 0 420 360">
             <path d="M40 130h340v200a16 16 0 01-16 16H56a16 16 0 01-16-16z" fill="#D9A866"/>
             <rect x="40" y="130" width="340" height="40" fill="#C9944F"/>
             <rect x="185" y="130" width="50" height="216" fill="#EBC58F"/>
           </svg>`);
        const flapL = el(box, "abs", { left: "40px", top: "100px", width: "170px", height: "34px", background: "#C9944F", borderRadius: "6px", transformOrigin: "0% 100%" });
        const flapR = el(box, "abs", { left: "210px", top: "100px", width: "170px", height: "34px", background: "#C9944F", borderRadius: "6px", transformOrigin: "100% 100%" });
        const vase = productMap(room, 640, 70, 180, "s7-product");
        const vaseOld = el(room, "abs", { display: "none" },
          `<svg width="160" height="240" viewBox="0 0 160 240"><path d="M55 10h50v30c35 20 45 60 40 110-5 50-30 80-65 80S20 200 15 150C10 100 20 60 55 40z" fill="${TEAL}"/><path d="M40 120c20 10 60 10 80 0" stroke="#fff" stroke-opacity="0.6" stroke-width="10" fill="none" stroke-linecap="round"/></svg>`);
        tl.fromTo(box, { y: 80, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, T(7, 0));
        tl.fromTo(flapL, { rotation: 0 }, { rotation: -130, duration: 0.5, ease: "back.out(1.6)" }, T(7, 0.6));
        tl.fromTo(flapR, { rotation: 0 }, { rotation: 130, duration: 0.5, ease: "back.out(1.6)" }, T(7, 0.65));
        tl.fromTo(vase, { y: 360, opacity: 0, rotation: -4 }, { y: 0, opacity: 1, rotation: 2, duration: 0.8, ease: "back.out(1.5)" }, T(7, 1.0));
        const spark = el(room, "abs", { left: "860px", top: "40px" }, icon("spark", 70, CORAL));
        tl.fromTo(spark, { scale: 0, rotation: -90 }, { scale: 1, rotation: 0, duration: 0.5, ease: "back.out(2.4)" }, T(7, 1.5));
        // a week passes: light sweeps, days fill
        tl.fromTo(beam, { x: -500 }, { x: 900, duration: 0.8, ease: "sine.inOut", repeat: 2 }, T(7, 2.1));
        tl.fromTo(sunI, { rotation: 0 }, { rotation: 360, duration: 2.4, ease: "none" }, T(7, 2.1));
        tl.fromTo(".s7-day", { backgroundColor: "rgba(20,184,166,0)" }, { backgroundColor: TEAL, borderColor: TEAL, duration: 0.15, stagger: 0.32 }, T(7, 2.2));
        // follow-up message with a heart → next group
        const ph = makePhone(st, 1240, 140, 330, 660, "s7-phone");
        const hb = bubble(ph.scr, 26, 120, 250, [180, 140], { in: true, icon: "heart", iconColor: CORAL, iconSize: 48 });
        const tap = el(ph.scr, "abs", { left: "120px", top: "170px", width: "60px", height: "60px", borderRadius: "50%", background: "rgba(19,35,63,0.3)" });
        const gc = el(ph.scr, "abs", { left: "24px", top: "330px", width: "254px", height: "200px", borderRadius: "22px", background: "#fff", border: `4px solid ${TEAL}`, padding: "20px", direction: "rtl" },
          `<div style="width:64px;height:64px;border-radius:18px;background:${TEAL};display:flex;align-items:center;justify-content:center;margin-bottom:12px">${icon("group", 44, "#fff")}</div>${lines([180, 130])}`);
        tl.set(tap, { opacity: 0 }, T(7, 0));
        tl.fromTo(ph.p, { x: 500, opacity: 0, rotation: 6 }, { x: 0, opacity: 1, rotation: 0, duration: 0.7, ease: "power3.out" }, T(7, 4.3));
        tl.fromTo(ph.glow, { opacity: 1 }, { opacity: 0, duration: 0.7, immediateRender: false }, T(7, 4.9));
        tl.fromTo(hb, { scale: 0.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.45, ease: "back.out(2)" }, T(7, 4.9));
        tl.fromTo(tap, { scale: 0.3, opacity: 0.8 }, { scale: 1.8, opacity: 0, duration: 0.45, immediateRender: false }, T(7, 5.6));
        tl.fromTo(gc, { y: 120, opacity: 0 }, { y: 0, opacity: 1, duration: 0.55, ease: "back.out(1.6)" }, T(7, 5.9));
        // quick cut: a personal order form
        const tcut = T(7, 6.8);
        tl.to([room, ph.p], { opacity: 0, duration: 0.2 }, tcut);
        const ph2 = makePhone(st, 780, 90, 360, 720, "s7-phone2");
        el(ph2.scr, "abs", { left: "0", right: "0", top: "0", height: "96px", background: "#FDE3DC" });
        const fields = [];
        for (let f = 0; f < 4; f++) {
          const box2 = el(ph2.scr, "abs", { left: "26px", right: "26px", top: px(140 + f * 112), height: "78px", borderRadius: "16px", border: "3px solid rgba(19,35,63,0.14)", background: "#fff", direction: "rtl", padding: "0 18px", display: "flex", alignItems: "center" });
          const fill = el(box2, "abs", { right: "18px", top: "31px", width: px(170 - f * 20), height: "14px", borderRadius: "7px", background: "rgba(19,35,63,0.3)", transformOrigin: "right center" });
          fields.push(fill);
        }
        const sub = el(ph2.scr, "abs", { left: "26px", right: "26px", top: "596px", height: "78px", borderRadius: "39px", background: "rgba(19,35,63,0.15)", display: "flex", alignItems: "center", justifyContent: "center" }, icon("check", 48, "#fff"));
        tl.fromTo(ph2.p, { y: 120, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, tcut + 0.1);
        tl.fromTo(fields, { scaleX: 0 }, { scaleX: 1, duration: 0.3, stagger: 0.28, ease: "power2.out" }, tcut + 0.45);
        tl.to(sub, { backgroundColor: TEAL, duration: 0.25 }, tcut + 1.7);
        tl.fromTo(sub, { scale: 1 }, { scale: 1.08, duration: 0.15, yoyo: true, repeat: 1, immediateRender: false }, tcut + 1.75);
      })();

      // =========================================================
      // SCENE 8 — AI reads partner emails (74–81)
      // =========================================================
      (() => {
        const st = sceneFrame(tl, 8);
        const cam = el(st, "layer", { transformOrigin: "50% 45%" });
        const lap = el(cam, "laptop abs", { left: "260px", top: "110px", width: "1400px", height: "740px" });
        el(lap, "lid"); el(lap, "base");
        const scr = el(lap, "lscreen");
        // inbox (right side, RTL)
        const inbox = el(scr, "abs", { right: "0", top: "0", bottom: "0", width: "560px", background: "#F3F1EC", borderLeft: "2px solid rgba(19,35,63,0.08)" });
        for (let r = 0; r < 6; r++) {
          el(inbox, "abs", { left: "24px", right: "24px", top: px(150 + r * 92), height: "78px", borderRadius: "14px", background: "#fff", display: "flex", alignItems: "center", gap: "16px", padding: "0 18px", direction: "rtl" },
            `<span style="display:block;width:44px;height:44px;border-radius:50%;background:${HUES[r][0]};flex:none"></span><div>${lines([220 - (r * 23) % 70, 150 - (r * 17) % 50], "l")}</div>`);
        }
        const mail = el(inbox, "abs", { left: "24px", right: "24px", top: "40px", height: "96px", borderRadius: "16px", background: "#fff", border: `4px solid ${TEAL}`, display: "flex", alignItems: "center", gap: "16px", padding: "0 18px", direction: "rtl", boxShadow: "0 10px 24px rgba(20,184,166,0.25)" },
          `<span style="display:block;flex:none">${icon("mail", 50, NAVY)}</span><div style="flex:1">${lines([200, 140])}</div>`);
        const att = el(inbox, "abs", { left: "36px", top: "58px", width: "64px", height: "64px" }, icon("sheet", 64, "#2FBF71"));
        tl.fromTo(mail, { y: -120, opacity: 0 }, { y: 0, opacity: 1, duration: 0.55, ease: "back.out(1.6)" }, T(8, 0.5));
        tl.fromTo(att, { scale: 0 }, { scale: 1, duration: 0.35, ease: "back.out(2.4)" }, T(8, 0.9));
        const ai = el(scr, "abs", { left: "1150px", top: "-6px", width: "110px", height: "110px", display: "flex", alignItems: "center", justifyContent: "center", filter: "drop-shadow(0 0 16px rgba(20,184,166,0.9))" }, icon("spark", 90, TEAL));
        tl.fromTo(ai, { scale: 0, rotation: -120, opacity: 0 }, { scale: 1, rotation: 0, opacity: 1, duration: 0.6, ease: "back.out(2)" }, T(8, 1.3));
        tl.fromTo(ai, { y: 0 }, { y: 14, duration: 0.5, yoyo: true, repeat: 3, ease: "sine.inOut", immediateRender: false }, T(8, 1.9));
        // structured table (left side)
        const table = el(scr, "abs", { left: "50px", top: "60px", width: "700px", height: "560px", borderRadius: "18px", background: "#fff", border: "3px solid rgba(19,35,63,0.08)" });
        el(table, "abs", { left: "0", right: "0", top: "0", height: "70px", borderRadius: "16px 16px 0 0", background: "rgba(20,184,166,0.16)" });
        tl.fromTo(table, { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, T(8, 1.6));
        // attachment unfolds into tiles that snap into rows
        const origin = { x: 1350 - 260 + 68, y: 58 + 110 + 32 };
        let k = 0;
        for (let r = 0; r < 6; r++) for (let c = 0; c < 4; c++, k++) {
          const tx = 50 + 24 + c * 168, ty = 60 + 90 + r * 74;
          const tile = el(scr, "abs", { left: px(tx), top: px(ty), width: "152px", height: "56px", borderRadius: "10px", background: c === 0 ? "#CFF3EC" : "#EEF1F6", border: c === 0 ? `2px solid ${TEAL}` : "2px solid rgba(19,35,63,0.06)", display: "flex", alignItems: "center", justifyContent: "center" },
            `<span class="ln ${c === 0 ? "t" : ""}" style="width:${90 - ((r * 13 + c * 29) % 40)}px;margin:0"></span>`);
          const rx = mulberry32(k + 99)();
          const cloudX = origin.x - 60 - tx + (rx - 0.5) * 420, cloudY = origin.y + 40 - ty + (mulberry32(k + 7)() - 0.5) * 300;
          tl.fromTo(tile, { x: origin.x - tx, y: origin.y - ty, scale: 0.2, opacity: 0, rotation: (rx - 0.5) * 60 },
            { x: cloudX, y: cloudY, scale: 0.8, opacity: 1, duration: 0.6, ease: "power2.out" }, T(8, 2.4 + k * 0.012));
          tl.to(tile, { x: 0, y: 0, scale: 1, rotation: 0, duration: 0.55, ease: "back.out(1.4)" }, T(8, 3.4 + r * 0.12 + c * 0.04));
        }
        const done = el(scr, "abs", { left: "690px", top: "30px", width: "90px", height: "90px", borderRadius: "50%", background: TEAL, display: "flex", alignItems: "center", justifyContent: "center", boxShadow: "0 10px 26px rgba(20,184,166,0.5)" }, icon("check", 56, "#fff"));
        tl.fromTo(done, { scale: 0 }, { scale: 1, duration: 0.45, ease: "back.out(2.6)" }, T(8, 4.6));
        tl.fromTo(cam, { scale: 1 }, { scale: 1.07, duration: 7, ease: "sine.inOut" }, T(8, 0));
      })();

      // =========================================================
      // SCENE 9 — Outro: the living network → end card (81–90)
      // =========================================================
      (() => {
        const st = sceneFrame(tl, 9);
        const cam = el(st, "layer", { transformOrigin: "50% 50%" });
        const r9 = mulberry32(909);
        const nodes = [];
        for (let gy = 0; gy < 6; gy++) for (let gx = 0; gx < 9; gx++) {
          const x = 140 + gx * 205 + (r9() - 0.5) * 120, y = 110 + gy * 170 + (r9() - 0.5) * 90;
          nodes.push([Math.round(x), Math.round(y), 16 + Math.round(r9() * 20)]);
        }
        const edges = [];
        nodes.forEach((a, i) => nodes.forEach((b, j) => { if (j > i && Math.hypot(a[0] - b[0], a[1] - b[1]) < 250 && (i * 7 + j) % 3 !== 0) edges.push([i, j]); }));
        const cv = buildCanvas(cam, nodes, edges, tl, T(9, 0.2), T(9, 6.2), { lw: 2.5 });
        // the whole network breathes in rhythm
        cv.nodeEls.forEach((n, i) => {
          tl.fromTo(n, { opacity: 0 }, { opacity: 1, duration: 0.3 }, T(9, (i % 9) * 0.04));
        });
        tl.fromTo(cam, { scale: 2.0 }, { scale: 0.92, duration: 5.6, ease: "power2.inOut" }, T(9, 0));
        // 26 automations count-up
        const badge = el(st, "abs", { left: "460px", top: "300px", width: "1000px", height: "300px", borderRadius: "40px", background: "rgba(247,244,238,0.92)", boxShadow: "0 30px 70px rgba(19,35,63,0.18)", display: "flex", alignItems: "center", justifyContent: "center", gap: "40px" });
        const num = el(badge, "bignum", { position: "relative", fontSize: "200px", color: NAVY }, "30", "s9-num");
        el(badge, "abs", { position: "relative", fontSize: "70px", fontWeight: "700", color: NAVY, direction: "rtl" }, "הודעות ידניות");
        el(badge, "abs", { position: "relative", width: "120px", height: "120px", borderRadius: "34px", background: TEAL, display: "flex", alignItems: "center", justifyContent: "center" }, icon("bolt", 80, "#fff"));
        tl.fromTo(badge, { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.6, ease: "back.out(1.7)" }, T(9, 1.6));
        const counter = { v: 30 };
        tl.to(counter, { v: 0, duration: 1.4, ease: "power2.out", onUpdate: () => { num.textContent = String(Math.round(counter.v)); } }, T(9, 1.9));
        tl.to(badge, { scale: 0.9, opacity: 0, duration: 0.4, ease: "power2.in" }, T(9, 4.8));
        // fade to the clean end card (logo + CTA added in editing)
        const end = el(st, "layer", { background: "#F7F4EE" });
        const ringA = el(end, "abs", { left: "-180px", top: "-180px", width: "520px", height: "520px", borderRadius: "50%", border: `3px solid rgba(20,184,166,0.45)` });
        const ringB = el(end, "abs", { right: "-160px", bottom: "-200px", width: "560px", height: "560px", borderRadius: "50%", border: `3px solid rgba(242,140,120,0.5)` });
        const hair = el(end, "abs", { left: "760px", top: "800px", width: "400px", height: "6px", borderRadius: "3px", background: TEAL, transformOrigin: "50% 50%" });
        const shot = el(end, "abs", { right: "150px", top: "130px", width: "380px", height: "805px", borderRadius: "28px", overflow: "hidden", boxShadow: "0 30px 70px rgba(19,35,63,0.22)", border: "8px solid #fff" },
          '<img src="assets/product.jpg" alt="" style="width:100%;height:100%;object-fit:cover;display:block" />');
        tl.fromTo(end, { opacity: 0 }, { opacity: 1, duration: 0.9, ease: "power1.inOut" }, T(9, 5.6));
        tl.fromTo(shot, { y: 60, opacity: 0, rotation: 3 }, { y: 0, opacity: 1, rotation: 1.5, duration: 0.9, ease: "power3.out" }, T(9, 6.0));
        tl.fromTo([ringA, ringB], { scale: 0.85 }, { scale: 1.06, duration: 3.2, ease: "sine.inOut" }, T(9, 5.6));
        tl.fromTo(hair, { scaleX: 0 }, { scaleX: 1, duration: 0.8, ease: "power3.out" }, T(9, 6.6));
      })();

      window.__timelines["main"] = tl;
    </script>
  </body>
